# Production profile (SPRING_PROFILES_ACTIVE=prod). All secrets come from environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/ahhub}
spring.datasource.username=${DB_USER:ahhub}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
app.demo-data=false
app.upload-dir=${UPLOAD_DIR:/data/uploads}
spring.thymeleaf.cache=true
# Behind the Caddy reverse proxy (HTTPS terminates there)
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.error.include-stacktrace=never
server.error.include-message=never
server.compression.enabled=true
spring.web.resources.cache.cachecontrol.max-age=7d

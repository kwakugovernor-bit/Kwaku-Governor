spring.application.name=African Heritage Hub
server.port=${PORT:8080}

# --- Database -------------------------------------------------------------
# Development: embedded H2 file database (data is kept in ./data between restarts).
spring.datasource.url=jdbc:h2:file:./data/ahhub
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Production example (add the driver dependency to pom.xml):
# spring.datasource.url=jdbc:postgresql://localhost:5432/ahhub
# spring.datasource.username=...   spring.datasource.password=...

# --- i18n: English (default), French, Spanish -----------------------------
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Uploads ----------------------------------------------------------------
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=40MB

# --- Accounts ---------------------------------------------------------------
app.admin.email=${ADMIN_EMAIL:admin@africanheritagehub.com}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
app.demo-data=${DEMO_DATA:true}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
